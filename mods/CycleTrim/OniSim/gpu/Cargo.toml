[package]
name = "onisim-gpu"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license-file = "../../../../LICENSE"
description = "Experimental Vulkan compute operators and targeted OniSim benchmarks"

[workspace]
resolver = "3"

[dependencies]
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "parking_lot", "vulkan", "wgsl"] }
bytemuck = "=1.25.2"
pollster = "=1.0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "=1.54.1", features = ["rt", "time", "sync"] }

[dev-dependencies]
naga = { version = "=30.0.1", features = ["wgsl-in"] }

[[bin]]
name = "flow-bench"
path = "src/bench.rs"

[[bin]]
name = "multicomponent-bench"
path = "src/multicomponent_bench.rs"

[[bin]]
name = "pressure-projection-bench"
path = "src/pressure_projection_bench.rs"

[[bin]]
name = "resident-pipeline-bench"
path = "src/resident_pipeline_bench.rs"

[[bin]]
name = "material-eos-calibrate"
path = "src/material_eos_calibrate.rs"
