[package]
name = "onisim-gpu"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license-file = "../../../../LICENSE"
description = "Experimental Vulkan compute operators and targeted OniSim benchmarks"

[workspace]
resolver = "3"

[dependencies]
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "parking_lot", "vulkan", "wgsl"] }
bytemuck = "=1.25.2"
pollster = "=1.0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "flow-bench"
path = "src/bench.rs"
