[package]
name = "onim"
version = "0.1.11"
edition = "2024"
license-file = "LICENSE"
description = "Command-line toolkit for creating, building, installing, and managing Oxygen Not Included mods."
repository = "https://github.com/LIghtJUNction/OniMods"
homepage = "https://github.com/LIghtJUNction/OniMods"
readme = "README-onim.md"
keywords = ["oxygen-not-included", "modding", "cli"]
categories = ["command-line-utilities"]
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/README-onim.md",
    "/CHANGELOG-onim.md",
    "/LICENSE",
    "/LICENSE.MIT",
    "/LICENSING.md",
    "/Directory.Build.props.example",
    "/src/**",
    "/mods/OniModTemplate/*.cs",
    "/mods/OniModTemplate/*.csproj",
    "/mods/OniModTemplate/*.md",
    "/mods/OniModTemplate/docs/*.md",
    "/mods/OniModTemplate/Patches/*.cs",
    "/tools/OniMods.SteamPublisher/*.cs",
    "/tools/OniMods.SteamPublisher/*.csproj",
    "/tools/OniMods.SteamPublisher/steam_appid.txt",
    "/tools/OniMods.SteamPublisher/consumer/steam_appid.txt",
]


[profile.release]
opt-level = 3
lto = true
strip = true

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
toml = "1.1.2"
