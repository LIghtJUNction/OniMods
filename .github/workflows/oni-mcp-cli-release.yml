name: oni-mcp CLI release

on:
  push:
    tags:
      - "oni-mcp-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux cross linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc cargo build --locked --release --bin oni-mcp --target "${{ matrix.target }}"
          else
            cargo build --locked --release --bin oni-mcp --target "${{ matrix.target }}"
          fi
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          BIN="target/${{ matrix.target }}/release/oni-mcp"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then BIN="${BIN}.exe"; fi
          cp "$BIN" dist/
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "../oni-mcp-${{ matrix.target }}.zip" *
          else
            tar -czf "../oni-mcp-${{ matrix.target }}.tar.gz" *
          fi
          cd ..
      - uses: actions/upload-artifact@v4
        with:
          name: oni-mcp-${{ matrix.target }}
          path: |
            oni-mcp-${{ matrix.target }}.*
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Generate checksums
        run: cd release && sha256sum oni-mcp-* > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
