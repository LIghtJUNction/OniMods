name: Mod quality

on:
  pull_request:
    paths:
      - 'mods/**'
      - 'tests/**'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/**'
      - 'tools/OniMods.SteamPublisher/**'
      - 'tools/OniHarness'
      - '.gitmodules'
      - 'ci/**'
      - 'docs/**'
      - '*.md'
      - '.editorconfig'
      - 'Directory.Build.*'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'NuGet.Config'
      - 'nuget.config'
      - '.agents/skills/**'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'mods/**'
      - 'tests/**'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/**'
      - 'tools/OniMods.SteamPublisher/**'
      - 'tools/OniHarness'
      - '.gitmodules'
      - 'ci/**'
      - 'docs/**'
      - '*.md'
      - '.editorconfig'
      - 'Directory.Build.*'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'NuGet.Config'
      - 'nuget.config'
      - '.agents/skills/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mod-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: true
      - name: Check changed-line whitespace
        run: python3 scripts/check_git_whitespace.py
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.401'
      - name: Fetch pinned ONI compile references for Jlib host tests
        run: |
          python3 scripts/fetch_oni_reference_assemblies.py \
            --manifest ci/oni-reference-assemblies.json \
            --output "$GITHUB_WORKSPACE/.oni-managed"
      - name: Pack shared Jlib package for host regressions
        run: |
          dotnet pack mods/Jlib/Jlib/Jlib.csproj -c Release \
            -p:TargetFrameworks=netstandard2.1 \
            -p:OniManagedPath="$GITHUB_WORKSPACE/.oni-managed" \
            -p:ImportDirectoryBuildProps=false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Test onim CLI regressions
        run: cargo +1.99.1 test --locked
      - name: Check Mod source contracts and host behavior
        env:
          ONI_MANAGED_PATH: ${{ github.workspace }}/.oni-managed
        run: python3 scripts/check_mods.py --skip-synthetic-performance
      - name: Report CycleTrim synthetic performance evidence
        run: python3 scripts/run_cycletrim_synthetic_performance.py
      - name: Verify pinned FastTrack Fetch compatibility contract
        run: python3 scripts/verify_cycletrim_fasttrack_fetch_contract.py --verify-upstream
      - name: Verify pinned FastTrack stationary-critter compatibility contract
        run: python3 scripts/verify_cycletrim_fasttrack_stationary_contract.py --verify-upstream
