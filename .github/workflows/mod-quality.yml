name: Mod quality

on:
  pull_request:
    paths:
      - 'mods/**'
      - 'tests/**'
      - 'benchmarks/CycleTrim.BrainBenchmarks/**'
      - 'scripts/**'
      - 'ci/**'
      - 'docs/**'
      - '*.md'
      - '.editorconfig'
      - 'Directory.Build.*'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'NuGet.Config'
      - 'nuget.config'
      - '.agents/skills/**'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'mods/**'
      - 'tests/**'
      - 'benchmarks/CycleTrim.BrainBenchmarks/**'
      - 'scripts/**'
      - 'ci/**'
      - 'docs/**'
      - '*.md'
      - '.editorconfig'
      - 'Directory.Build.*'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'NuGet.Config'
      - 'nuget.config'
      - '.agents/skills/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mod-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check changed-line whitespace
        run: python3 scripts/check_git_whitespace.py
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.401'
      - name: Check Mod source contracts and host behavior
        run: python3 scripts/check_mods.py --skip-synthetic-performance
      - name: Run CycleTrim synthetic performance probe
        run: >-
          dotnet run
          --project tests/CycleTrim.PerformanceProbe.Tests/CycleTrim.PerformanceProbe.Tests.csproj
          --configuration Release
          -p:ImportDirectoryBuildProps=false
          -p:TreatWarningsAsErrors=true
          -- --synthetic-performance-only
      - name: Verify pinned MCP 2026 conformance map
        run: python3 scripts/verify_onimcp_conformance_map.py --verify-upstream
      - name: Verify pinned FastTrack Fetch compatibility contract
        run: python3 scripts/verify_cycletrim_fasttrack_fetch_contract.py --verify-upstream
      - name: Verify pinned FastTrack stationary-critter compatibility contract
        run: python3 scripts/verify_cycletrim_fasttrack_stationary_contract.py --verify-upstream
      - name: Run CycleTrim synthetic benchmarks
        run: >-
          dotnet run
          --project benchmarks/CycleTrim.BrainBenchmarks/CycleTrim.BrainBenchmarks.csproj
          --configuration Release
          -p:ImportDirectoryBuildProps=false
          -p:TreatWarningsAsErrors=true
          -- --benchmark
      - name: Repeat CycleTrim NavGrid gate across processes
        run: python3 scripts/run_cycletrim_navgrid_stability.py --runs 5
