name: ONI reference compatibility

on:
  pull_request:
    paths:
      - 'mods/**'
      - 'tests/**'
      - 'benchmarks/CycleTrim.BrainBenchmarks/**'
      - 'scripts/**'
      - 'ci/oni-reference-assemblies.json'
      - 'ci/oni-harmony-api-surface-baseline/**'
      - 'AGENTS.md'
      - 'docs/autonomous-iteration.md'
      - '.editorconfig'
      - '.agents/skills/autonomous-gh-iteration/**'
      - '.agents/skills/oni-mcp-autonomous-iteration/**'
      - 'Directory.Build.*'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'NuGet.Config'
      - 'nuget.config'
      - '.github/workflows/oni-reference-compat.yml'
  push:
    branches: [main]
    paths:
      - 'mods/**'
      - 'tests/**'
      - 'benchmarks/CycleTrim.BrainBenchmarks/**'
      - 'scripts/**'
      - 'ci/oni-reference-assemblies.json'
      - 'ci/oni-harmony-api-surface-baseline/**'
      - 'AGENTS.md'
      - 'docs/autonomous-iteration.md'
      - '.editorconfig'
      - '.agents/skills/autonomous-gh-iteration/**'
      - '.agents/skills/oni-mcp-autonomous-iteration/**'
      - 'Directory.Build.*'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'NuGet.Config'
      - 'nuget.config'
      - '.github/workflows/oni-reference-compat.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oni-reference-compat-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-and-surface:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Verify reference provenance and lag status
        run: >-
          python3 scripts/verify_oni_reference_provenance.py
          --manifest ci/oni-reference-assemblies.json
          --verify-official
          --verify-upstream
      - name: Fetch and verify pinned reference assemblies
        run: >-
          python3 scripts/fetch_oni_reference_assemblies.py
          --manifest ci/oni-reference-assemblies.json
          --output "$GITHUB_WORKSPACE/.oni-managed"
      - name: Verify pinned ONI 744825 NavGrid method-body contract
        run: >-
          python3 scripts/verify_cycletrim_navgrid_source_contract.py
          --manifest ci/oni-reference-assemblies.json
      - name: Verify pinned ONI 744825 fetch method-body contract
        run: >-
          python3 scripts/verify_cycletrim_fetch_source_contract.py
          --manifest ci/oni-reference-assemblies.json
      - name: Install pinned ILSpy command line tool
        run: dotnet tool install --global ilspycmd --version 11.0.0.9375
      - name: Verify CycleTrim reflected Harmony API against pinned references
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/check_cycletrim_reference_api.py \
            "$GITHUB_WORKSPACE/.oni-managed/Assembly-CSharp.dll" \
            2>&1 | tee "$RUNNER_TEMP/cycletrim-reference-api.log"
      - name: Upload CycleTrim reference-API diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cycletrim-reference-api-diagnostics
          path: ${{ runner.temp }}/cycletrim-reference-api.log
          if-no-files-found: error
          retention-days: 7
      - name: Build CycleTrim against pinned references
        run: >-
          dotnet build mods/CycleTrim/CycleTrim.csproj
          --configuration Release
          -p:OniManagedPath="$GITHUB_WORKSPACE/.oni-managed"
          -p:ImportDirectoryBuildProps=false
          -p:TreatWarningsAsErrors=true
      - name: Verify compiled CycleTrim release safety guards
        run: python3 scripts/verify_cycletrim_release_binary.py
      - name: Build OniMcp against pinned references
        run: >-
          dotnet build mods/OniMcp/OniMcp.csproj
          --configuration Release
          -p:OniManagedPath="$GITHUB_WORKSPACE/.oni-managed"
          -p:ImportDirectoryBuildProps=false
          -p:TreatWarningsAsErrors=true
      - name: Run source and executable regressions
        run: python3 scripts/check_mods.py
      - name: Extract Harmony target API surface
        run: >-
          python3 scripts/extract_harmony_api_surface.py
          "$GITHUB_WORKSPACE/.oni-managed"
          --output "$GITHUB_WORKSPACE/artifacts/oni-api-surface"
      - name: Verify Harmony target API baseline
        run: >-
          python3 scripts/check_harmony_api_surface_baseline.py
          --current "$GITHUB_WORKSPACE/artifacts/oni-api-surface/index.json"
          --baseline "$GITHUB_WORKSPACE/ci/oni-harmony-api-surface-baseline"
      - name: Prepare signatures-only API artifact
        run: >-
          python3 scripts/prepare_oni_api_surface_artifact.py
          "$GITHUB_WORKSPACE/artifacts/oni-api-surface"
      - name: Confirm API artifact contains no game binaries or decompiled source
        run: >-
          test -z "$(find artifacts/oni-api-surface -type f
          \( -name '*.dll' -o -name '*.cs' -o -name '*.exe' -o -name '*.nupkg' -o -name '*.pdb' \)
          -print -quit)"
      - name: Upload API surface only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oni-harmony-api-surface
          path: artifacts/oni-api-surface
          if-no-files-found: error
          retention-days: 14
      - name: Compile CycleTrim against .NET Standard 2.1
        shell: bash
        run: |
          set -euo pipefail
          compat_root="$RUNNER_TEMP/cycletrim-netstandard21"
          # BaseIntermediateOutputPath changes the SDK's default glob exclusions.
          # Remove the earlier net48 obj tree so generated AssemblyInfo files cannot
          # be picked up as normal source by this isolated compatibility compile.
          rm -rf mods/CycleTrim/obj
          dotnet restore mods/CycleTrim/CycleTrim.csproj \
            -p:TargetFramework=netstandard2.1 \
            -p:OniManagedPath="$GITHUB_WORKSPACE/.oni-managed" \
            -p:ImportDirectoryBuildProps=false \
            -p:BaseIntermediateOutputPath="$compat_root/obj/"
          dotnet msbuild mods/CycleTrim/CycleTrim.csproj \
            -target:Compile \
            -property:Configuration=Release \
            -property:TargetFramework=netstandard2.1 \
            -property:OniManagedPath="$GITHUB_WORKSPACE/.oni-managed" \
            -property:ImportDirectoryBuildProps=false \
            -property:BaseIntermediateOutputPath="$compat_root/obj/" \
            -property:OutputPath="$compat_root/bin/" \
            -property:TreatWarningsAsErrors=true
