name: OniSim offline experiment kit
on:
  push:
    branches: [perf/onisim-transport-20261020]
    paths: [.github/workflows/onisim-lab-bootstrap.yml]
permissions:
  contents: read
jobs:
  kit:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Prepare pinned formatter
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.90.0 --profile minimal --component rustfmt
          mkdir -p out
          cp "$(rustc +1.90.0 --print sysroot)/bin/rustfmt" out/
          sha256sum out/rustfmt > out/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: onisim-rustfmt
          path: out/
          retention-days: 1
          if-no-files-found: error
