name: Apply reviewed OniMcp source

on:
  push:
    branches: ['fix/onimcp-map-contract-and-survival-tools']
    paths: ['.github/workflows/onimcp-apply-reviewed-source.yml']

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'LIghtJUNction/OniMods'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Run the pinned, hash-checked source application
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          import textwrap
          source = subprocess.check_output(['git', 'show', 'ec053d0c0be19b87bda0f0386a45eeec8c0d7e6e:.github/workflows/onimcp-apply-reviewed-source.yml'], text=True)
          script = textwrap.dedent(source.split("python3 - <<'PY'\n", 1)[1].rsplit('\n          PY', 1)[0])
          exec(compile(script, 'reviewed-source-application', 'exec'))
          PY
