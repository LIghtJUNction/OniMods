name: OniSim native platforms

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mods/CycleTrim/OniSim/**'
      - 'tests/OniSim.Loader.Tests/**'
      - 'scripts/build_onisim_native.py'
      - '.github/workflows/onisim-native.yml'
  pull_request:
    paths:
      - 'mods/CycleTrim/OniSim/**'
      - 'tests/OniSim.Loader.Tests/**'
      - 'scripts/build_onisim_native.py'
      - '.github/workflows/onisim-native.yml'

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x64
          - os: windows-2022
            platform: windows-x64
          - os: macos-15-intel
            platform: macos-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      ONI_MANAGED_PATH: ${{ github.workspace }}/.oni-managed
      RUSTC_WRAPPER: ''
      RUSTC_WORKSPACE_WRAPPER: ''
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: '-C target-feature=+crt-static'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch Jlib loader dependency
        run: git submodule update --init --depth 1 mods/Jlib
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.99.1 --profile minimal
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.401'
      - name: Fetch pinned compile references for the Jlib loader
        run: python scripts/fetch_oni_reference_assemblies.py --manifest ci/oni-reference-assemblies.json --output .oni-managed
      - name: Test unavailable Vulkan backend on Apple
        if: runner.os == 'macOS'
        working-directory: mods/CycleTrim/OniSim
        run: >-
          cargo +1.99.1 test --release --locked --manifest-path gpu/Cargo.toml --lib
          gpu_context::tests::unavailable_vulkan_backend_returns_errors_from_both_constructors -- --exact
      # Hosted runners have no hardware Vulkan adapter. Keep CPU and loader
      # coverage here; these explicit hardware cases remain in the default test
      # suite and must pass separately on a real GPU before release. No software
      # adapter or successful no-op is substituted for hardware acceptance.
      - name: Test native CPU simulation behavior (hardware cases excluded)
        working-directory: mods/CycleTrim/OniSim
        run: >-
          cargo +1.99.1 test --release --locked --manifest-path native/Cargo.toml --
          --skip gpu_pathfinder_ffi::tests::test_gpu_pathfinder_ffi
          --skip gpu_sim::bubble_tests::cropped_cross_phase_columns_match_ordered_cpu_moves_at_map_edges
          --skip gpu_sim::bubble_tests::same_phase_mixtures_never_submit_bubble_work
          --skip gpu_sim::gas_cpu::tests::cpu_batch_rejects_late_invalid_world_before_any_output_commit
          --skip gpu_sim::gas_cpu::tests::owned_outputs_match_borrowed_outputs_and_preserve_errors
          --skip gpu_sim::gas_cpu::tests::parallel_cpu_gas_matches_gpu_for_every_channel_and_thermal_stage
          --skip gpu_sim::material_range_tests::gas_pipeline_reuses_alternating_region_sizes
          --skip gpu_sim::material_range_tests::gas_density_transport_and_heat_chain_conserves_mass_and_energy
          --skip gpu_sim::material_range_tests::direct_gas_transport_spreads_into_vacuum_without_crossing_walls_or_oscillating
          --skip gpu_sim::material_range_tests::gas_pressure_transport_and_heat_chain_conserves_mass_and_energy
          --skip gpu_sim::material_range_tests::gas_region_preserves_unmapped_primary_and_secondary_components
          --skip gpu_sim::material_range_tests::gpu_region_accepts_three_four_five_six_and_sixteen_distinct_gases_without_losing_mass
          --skip gpu_sim::material_range_tests::liquid_dispatch_before_gas_pressure_matches_serial_order
          --skip gpu_sim::material_range_tests::liquid_pipeline_cache_retains_multiple_region_shapes
          --skip gpu_sim::material_range_tests::liquid_region_diffuses_on_gpu_and_preserves_mass_and_energy
          --skip gpu_sim::material_range_tests::overlapped_liquid_matches_serial_with_gas_in_same_region
          --skip gpu_sim::material_range_tests::region_diffuses_two_gases_on_gpu_without_losing_mass
          --skip gpu_sim::material_range_tests::world_gas_region_uses_gpu_chain_without_duplicate_thermal_faces
          --skip gpu_sim::thermal_cpu::tests::hybrid_complete_steps_track_gpu_reference_without_species_loss
          --skip gpu_sim::thermal_cpu::tests::sparse_face_cpu_heat_matches_gpu_gather_and_energy
          --skip liquid_transport::tests::gpu_diffusion_leaves_extra_species_cells_owned_by_volume_transport
          --skip multicomponent_flux::tests::liquid_workspace_reuses_storage_after_warmup_and_resets_obstacles
          --skip multicomponent_flux::tests::gas_batch_matches_serial_with_equal_shapes_and_invalidated_inputs
          --skip multicomponent_flux::tests::gas_batch_sleeping_worlds_stay_asleep_and_wake_on_input_change
      - name: Build native library and identity receipt
        run: python scripts/build_onisim_native.py --output-root artifacts/OniSim
      - name: Test platform loader against the built native library
        run: >-
          dotnet run --project tests/OniSim.Loader.Tests -c Release
          -p:ImportDirectoryBuildProps=false -- artifacts/OniSim
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: onisim-${{ matrix.platform }}
          path: artifacts/OniSim/
          if-no-files-found: error
          retention-days: 14
  bundle:
    needs: native
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: onisim-*
          path: artifacts/OniSim
          merge-multiple: true
      - name: Require all three matching platform builds
        run: python3 scripts/build_onisim_native.py --validate-bundle artifacts/OniSim
      - name: Reject incomplete, stale and tampered native bundles
        run: python3 -m unittest discover -s tests/OniSim.Loader.Tests -p 'test_*.py' -v
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: onisim-all-platforms
          path: artifacts/OniSim/
          if-no-files-found: error
          retention-days: 14
