name: OniSim diamond proof and regression

on:
  pull_request:
    paths:
      - "mods/CycleTrim/OniSim/**"
      - ".github/workflows/onisim-diamond.yml"
  push:
    branches: [main]
    paths:
      - "mods/CycleTrim/OniSim/**"
      - ".github/workflows/onisim-diamond.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  component-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - name: Build original and optimized Rust components
        run: python3 mods/CycleTrim/OniSim/lean-lab/harness/run.py build
      - name: Test native CPU behavior without game files (hardware cases excluded)
        working-directory: mods/CycleTrim/OniSim
        env:
          RUSTC_WRAPPER: ""
          RUSTC_WORKSPACE_WRAPPER: ""
        # Hosted runners have no hardware Vulkan adapter; hardware acceptance is separate.
        run: >-
          cargo +1.99.1 test --release --locked --manifest-path native/Cargo.toml
          --
          --skip gpu_pathfinder_ffi::tests::test_gpu_pathfinder_ffi
          --skip gpu_sim::bubble_tests::cropped_cross_phase_columns_match_ordered_cpu_moves_at_map_edges
          --skip gpu_sim::bubble_tests::same_phase_mixtures_never_submit_bubble_work
          --skip gpu_sim::gas_cpu::tests::cpu_batch_rejects_late_invalid_world_before_any_output_commit
          --skip gpu_sim::gas_cpu::tests::owned_outputs_match_borrowed_outputs_and_preserve_errors
          --skip gpu_sim::gas_cpu::tests::parallel_cpu_gas_matches_gpu_for_every_channel_and_thermal_stage
          --skip gpu_sim::material_range_tests::gas_pipeline_reuses_alternating_region_sizes
          --skip gpu_sim::material_range_tests::gas_density_transport_and_heat_chain_conserves_mass_and_energy
          --skip gpu_sim::material_range_tests::direct_gas_transport_spreads_into_vacuum_without_crossing_walls_or_oscillating
          --skip gpu_sim::material_range_tests::gas_pressure_transport_and_heat_chain_conserves_mass_and_energy
          --skip gpu_sim::material_range_tests::gas_region_preserves_unmapped_primary_and_secondary_components
          --skip gpu_sim::material_range_tests::gpu_region_accepts_three_four_five_six_and_sixteen_distinct_gases_without_losing_mass
          --skip gpu_sim::material_range_tests::liquid_dispatch_before_gas_pressure_matches_serial_order
          --skip gpu_sim::material_range_tests::liquid_pipeline_cache_retains_multiple_region_shapes
          --skip gpu_sim::material_range_tests::liquid_region_diffuses_on_gpu_and_preserves_mass_and_energy
          --skip gpu_sim::material_range_tests::overlapped_liquid_matches_serial_with_gas_in_same_region
          --skip gpu_sim::material_range_tests::region_diffuses_two_gases_on_gpu_without_losing_mass
          --skip gpu_sim::material_range_tests::world_gas_region_uses_gpu_chain_without_duplicate_thermal_faces
          --skip gpu_sim::thermal_cpu::tests::hybrid_complete_steps_track_gpu_reference_without_species_loss
          --skip gpu_sim::thermal_cpu::tests::sparse_face_cpu_heat_matches_gpu_gather_and_energy
          --skip liquid_transport::tests::gpu_diffusion_leaves_extra_species_cells_owned_by_volume_transport
          --skip multicomponent_flux::tests::gas_batch_matches_serial_with_equal_shapes_and_invalidated_inputs
          --skip multicomponent_flux::tests::gas_batch_sleeping_worlds_stay_asleep_and_wake_on_input_change
      - name: Run differential correctness cases
        run: python3 mods/CycleTrim/OniSim/lean-lab/harness/run.py verify
  memory-probe-protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.401'
      - name: Build memory request protocol tests without game files
        run: >-
          dotnet build mods/CycleTrim/OniSim/conformance/memory_probe/MemoryProbe.csproj
          -c Release --disable-build-servers -p:ProbeProtocolTests=true
          -p:ImportDirectoryBuildProps=false -p:ImportDirectoryBuildTargets=false -p:NuGetAudit=false
          -p:BaseIntermediateOutputPath="$RUNNER_TEMP/memory-probe-protocol/obj/"
          -p:OutputPath="$RUNNER_TEMP/memory-probe-protocol/bin/"
      - name: Check UTC and non-UTC memory request boundaries
        run: dotnet "$RUNNER_TEMP/memory-probe-protocol/bin/CycleTrim.MemoryProbe.dll"
  lean-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Lean 4.19.0 through elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.19.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check all Lean proofs and logical dependencies
        run: bash mods/CycleTrim/OniSim/lean-lab/proof/verify.sh

  gpu-operator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - name: Validate WGSL and run CPU transport invariants (hardware cases excluded)
        # Still compile every GPU test. These explicit hardware cases run on a GPU host.
        run: >-
          cargo +1.99.1 test --release --locked --manifest-path mods/CycleTrim/OniSim/gpu/Cargo.toml --lib
          --
          --skip gas_pressure_faces::tests::checkerboard_settles_sleeps_and_wakes_on_input_change
          --skip gpu_pathfinder::tests::test_gpu_pathfinder_evaluates_chores
          --skip multicomponent::tests::deferred_cfl_rejects_unstable_velocity_before_host_outputs_change
          --skip multicomponent::tests::bounded_transport_preserves_species_and_heat_with_large_velocities
          --skip multicomponent::tests::batch_readback_rejects_one_invalid_world_without_publishing_any_world
          --skip multicomponent::tests::gas_projection_matches_full_readback_and_checks_deferred_cfl
          --skip multicomponent::tests::gpu_cfl_reduction_handles_partial_workgroup_and_invalid_velocity
          --skip multicomponent::tests::gpu_concentration_diffusion_mixes_and_conserves_mass_and_energy
          --skip multicomponent::tests::gpu_density_velocity_matches_neighbour_gradients
          --skip multicomponent::tests::gpu_diffusion_preserves_species_and_energy_over_many_steps_with_wall
          --skip multicomponent::tests::liquid_diffusion_mixes_without_crossing_walls_and_conserves_each_species
          --skip multicomponent::tests::liquid_projection_matches_full_result_and_rejects_three_components
          --skip multicomponent::tests::packed_and_wide_sparse_inputs_can_alternate_without_stale_gpu_state
          --skip multicomponent::tests::pending_liquid_can_overlap_other_gpu_work_and_guards_reuse
          --skip multicomponent::tests::sparse_gas_upload_expands_mass_and_energy_and_checks_metadata
          --skip multicomponent::tests::sparse_input_partial_updates_preserve_other_blocks
          --skip multicomponent::tests::sparse_solid_partial_update_changes_only_target_cells
          --skip multicomponent::tests::validated_substeps_transport_high_velocity_without_losing_mass
          --skip thermal_diffusion::tests::deferred_groups_recompute_only_changed_blocks_and_handle_skipped_revisions
          --skip thermal_diffusion::tests::deferred_groups_skip_only_faces_with_the_same_nonzero_group
          --skip thermal_diffusion::tests::gathered_faces_match_two_pass_gpu_with_deferred_groups
          --skip thermal_diffusion::tests::gpu_deferred_groups_match_cpu_with_packed_tails_and_changing_inputs
          --skip thermal_diffusion::tests::gpu_material_lookup_matches_cpu_for_odd_grid_and_table_changes
          --skip thermal_diffusion::tests::gpu_material_lookup_updates_last_partial_block
          --skip thermal_diffusion::tests::mass_upload_tracks_changed_blocks_and_external_overwrites
          --skip thermal_diffusion::tests::temperature_upload_tracks_gpu_results_and_external_access
          --skip thermal_diffusion::tests::thermal_diffusion_end_to_end_conserves_energy
          --skip thermal_enthalpy::tests::conductivity_uses_species_mass_weights_and_handles_empty_cells
          --skip thermal_enthalpy::tests::thermal_output_updates_species_enthalpy_without_intermediate_readback
      - name: Compile Vulkan benchmark executables
        run: cargo +1.99.1 check --release --locked --manifest-path mods/CycleTrim/OniSim/gpu/Cargo.toml --all-targets
      - name: Smoke-test the EOS calibration CLI with synthetic records
        run: cargo +1.99.1 run --release --locked --manifest-path mods/CycleTrim/OniSim/gpu/Cargo.toml --bin material-eos-calibrate -- mods/CycleTrim/OniSim/gpu/tests/fixtures/material_eos_synthetic.json

  pressure-projection-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate isolated variable-density Poisson reference
        run: python3 -m unittest discover -s mods/CycleTrim/OniSim/gpu/reference -p 'test_*.py' -v
